name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        pip install pytest
        pytest tests/ -v
    
    - name: Create extension package
      run: |
        cd extension
        zip -r ../ai-hub-extension-${{ github.ref_name }}.zip .
    
    - name: Create server package
      run: |
        zip -r ai-hub-server-${{ github.ref_name }}.zip local/ requirements.txt
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ai-hub-extension-${{ github.ref_name }}.zip
          ai-hub-server-${{ github.ref_name }}.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
